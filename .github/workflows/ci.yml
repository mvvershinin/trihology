name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -c constraints-release.txt
      - run: python -m ruff check phototrichogram tests tools run_phototrichogram.py
      - run: python -m mypy phototrichogram
      - run: lint-imports
      - run: python -m pytest -q
      - run: env -u DISPLAY -u WAYLAND_DISPLAY python -m pytest -q
