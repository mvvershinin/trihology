name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Проверить версию
        id: parse
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            VERSION=$(python3 tools/release.py version "$RELEASE_TAG")
          else
            VERSION=$(python3 tools/release.py version)
          fi
          python3 tools/release.py notes "$VERSION" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  test:
    needs: version
    uses: ./.github/workflows/ci.yml
  build-linux:
    needs: [version, test]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PHOTOTRICHOGRAM_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash tools/build_linux_release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            dist/Phototrichogram-linux-x86_64.AppImage
            dist/build-info-linux.json
          if-no-files-found: error
          retention-days: 7
  build-windows:
    needs: [version, test]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -c constraints-release.txt
      - run: python tools/release.py build $env:RELEASE_VERSION
      - run: python tools/release.py windows
      - name: Проверить распакованный ZIP вне исходников
        run: |
          $check = Join-Path $env:RUNNER_TEMP "Проверка поставки"
          Expand-Archive dist/Phototrichogram-win64.zip -DestinationPath $check
          $output = Join-Path $check 'smoke.json'
          $exe = Join-Path $check 'Phototrichogram/phototrichogram.exe'
          Push-Location $check
          try {
            $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$output`"") -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Таймаут самопроверки' }
            if ($process.ExitCode -ne 0) { throw "Самопроверка: $($process.ExitCode)" }
          } finally { Pop-Location }
          python tools/check_smoke.py "$output" $env:RELEASE_VERSION
          Copy-Item dist/phototrichogram/build-info.json dist/build-info-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/Phototrichogram-win64.zip
            dist/build-info-windows.json
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push'
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Проверить комплект и сформировать описание
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 tools/release.py manifest artifacts
          python3 tools/release.py notes "$VERSION" > release-notes.md
      - name: Опубликовать полный релиз
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Фототрихограмма $VERSION" --notes-file release-notes.md \
            artifacts/Phototrichogram-linux-x86_64.AppImage \
            artifacts/Phototrichogram-win64.zip artifacts/SHA256SUMS artifacts/build-info.json
