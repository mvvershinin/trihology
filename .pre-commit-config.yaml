# Pre-commit хуки Phototrichogram.
# Установка (не выполняется автоматически): .venv/bin/pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: ruff (линтер)

  - repo: local
    hooks:
      # language: python — pre-commit сам ставит import-linter в изолированное
      # окружение; активированный .venv для коммита не требуется
      - id: lint-imports
        name: import-linter (архитектурные слои)
        description: "gui -> reports -> (core | data) -> utils: запрет обратных зависимостей"
        entry: lint-imports
        language: python
        additional_dependencies: ["import-linter>=2.0,<3"]
        pass_filenames: false
        files: \.py$
